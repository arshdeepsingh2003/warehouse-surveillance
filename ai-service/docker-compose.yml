version: '3.9'

services:

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ../warehouse-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK_DATA=true
      - DEBUG=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── AI camera stream service ──────────────────────────────────────────────
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./mock_sources:/app/mock_sources:ro
      - ./models:/app/models
    environment:
      - BACKEND_URL=http://backend:8000
      - USE_MOCK_SOURCES=true
      - USE_REAL_AI=true
      - DETECTOR_BACKEND=auto
      - DEVICE=cpu
      - STREAM_FPS=10
      - LOITERING_SECONDS=45
    depends_on:
      backend:
        condition: service_healthy

  # ── React frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../warehouse-dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/ws
      - VITE_STREAM_URL=http://localhost:8001
    depends_on:
      - backend
      - ai-service

